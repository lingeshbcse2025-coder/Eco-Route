<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EcoRoute — Micro-Logistics Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-icon">🌿</span>
      <div>
        <h1>EcoRoute</h1>
        <p>Micro-Logistics Carbon Tracker</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="card form-card">
      <h2>Log a Delivery</h2>
      <form id="delivery-form">
        <label>
          Order / Route ID
          <input type="text" id="routeId" placeholder="e.g. RT-104" required>
        </label>

        <label>
          Distance (km)
          <input type="number" id="distance" min="0" step="0.1" placeholder="e.g. 12.5" required>
        </label>

        <label>
          Vehicle
          <select id="vehicleType">
            <option value="Petrol Bike">Petrol Bike</option>
            <option value="EV">EV</option>
            <option value="Diesel Van">Diesel Van</option>
          </select>
        </label>

        <label>
          Traffic
          <select id="trafficLevel">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>
        </label>

        <button type="submit">Log Delivery</button>
        <p id="form-error" class="error" hidden></p>
      </form>
    </section>

    <section class="right-column">
      <div class="card summary-card">
        <h2>Today's Footprint</h2>
        <div class="summary-total" id="total-emissions">0.00 g</div>
        <div class="summary-meta" id="delivery-count">0 deliveries logged</div>
        <div id="advisory-banner" class="advisory" hidden>
          💡 <strong>ECO-ADVISORY:</strong> High footprint detected.
          <span id="advisory-message"></span>
        </div>
      </div>

      <div class="card table-card">
        <h2>Delivery Log</h2>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Vehicle</th>
              <th>Traffic</th>
              <th>Distance</th>
              <th>CO₂</th>
            </tr>
          </thead>
          <tbody id="log-rows">
            <tr class="empty-row"><td colspan="5">No data logged yet today.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
